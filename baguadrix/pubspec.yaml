name: baquadrix
description: "O bagre dos agendamentos"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  image_picker: ^1.2.0
  injectable: ^2.5.2
  get_it: ^8.3.0
  flutter_bloc: ^9.1.1
  path: ^1.9.1

  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc: ^9.1.0
  injectable_generator: ^2.9.0
  build_runner: ^2.10.1

flutter:

  uses-material-design: true
  generate: true

  assets:
    - lib/core/database/migrations/database.sql
    - lib/assets/
